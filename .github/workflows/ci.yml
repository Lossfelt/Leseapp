name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Repoet har ingen tester, lint eller typesjekk ennå. Bygget verifiserer at
  # npm ci går gjennom og at vendor-filene fra pdfjs-dist og jszip fortsatt
  # ligger der copy-vendor.mjs forventer dem (samme kommando som Netlify kjører).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (kopier vendor-filer)
        run: npm run build

  # Fletter Dependabot-PR-er automatisk når CI er grønn, men bare minor- og
  # patch-oppdateringer. Major-hopp blir liggende for manuell testing.
  # Unntak: GitHub Actions-oppdateringer flettes selv om de er major, fordi
  # PR-ens egen CI kjører med den nye action-versjonen og dermed tester den.
  # Flettes direkte i stedet for med "gh pr merge --auto", slik at det ikke
  # krever branch protection eller "Allow auto-merge" i repoet.
  dependabot-fletting:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
